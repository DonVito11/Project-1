
stages:
  - validate
  - build
  - compliance
  - release

variables:
  PACKER_TEMPLATE: "packer/amazon-linux.pkr.hcl"
  PACKER_LOG: "1"
  AWS_DEFAULT_REGION: "us-east-1"

default:
  interruptible: false

validate:
  stage: validate
  image: hashicorp/packer:latest
  script:
    - packer init "$PACKER_TEMPLATE"
    - packer fmt -check -recursive packer/
    - packer validate "$PACKER_TEMPLATE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build_stig_ami:
  stage: build
  image: hashicorp/packer:latest
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli jq
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s
      AWS_SECRET_ACCESS_KEY=%s
      AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_BUILD_ROLE_ARN"
      --role-session-name "gitlab-stig-build"
      --web-identity-token "$AWS_ID_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))
    - aws sts get-caller-identity
    - packer init "$PACKER_TEMPLATE"
  script:
    - packer build -var "aws_region=$AWS_DEFAULT_REGION"
        "$PACKER_TEMPLATE"
    - test -s manifest.json
    - jq -r '.builds[] | select(.name == "stig-ami")
        | .artifact_id' manifest.json
        | sed 's/.*://' > ami_id.txt
    - test -s ami_id.txt
    - grep -Eq '^ami-[0-9a-f]+$' ami_id.txt
  artifacts:
    paths:
      - ami_id.txt
      - manifest.json
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

scan_stig:
  stage: compliance
  image: amazon/aws-cli:2
  needs:
    - job: build_stig_ami
      artifacts: true
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - yum install -y jq
    - >
      CREDS=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_SCAN_ROLE_ARN"
      --role-session-name "gitlab-stig-scan"
      --web-identity-token "$AWS_ID_TOKEN"
      --duration-seconds 3600)
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')
  script:
    - mkdir -p reports
    - ./compliance/scan-stig.sh "$(cat ami_id.txt)"
  artifacts:
    when: always
    paths:
      - reports/
      - ami_id.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release_ami:
  stage: release
  image: amazon/aws-cli:2
  needs:
    - job: build_stig_ami
      artifacts: true
    - job: scan_stig
      artifacts: true
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - yum install -y jq
    - >
      CREDS=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_RELEASE_ROLE_ARN"
      --role-session-name "gitlab-stig-release"
      --web-identity-token "$AWS_ID_TOKEN"
      --duration-seconds 3600)
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')
  script:
    - test -s reports/stig-results.json
    - jq -e '.passed == true and .approved == true'
        reports/stig-results.json
    - ./scripts/publish-ami.sh "$(cat ami_id.txt)"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
